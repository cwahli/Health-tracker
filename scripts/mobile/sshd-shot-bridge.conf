# Reclaim a reverse-forwarded port from a dead client.
#
# A phone that drops off LTE without a clean TCP FIN leaves its ssh session
# half-alive on this box, and that session keeps holding 127.0.0.1:7777. The
# phone's next reconnect is then REFUSED the forward, and because the shipped
# default is ClientAliveInterval 0 (verified on the host: `sshd -T` prints
# `clientaliveinterval 0`), sshd never asks the corpse whether it is still
# there -- so :7777 stays squatted and every pull_shot.sh fails with
# "bridge unreachable" until someone bounces sshd. That is the difference
# between a one-minute blip and the tunnel being down for hours.
#
# 20s x 3 unanswered probes = a dead link noticed and the port freed in about a
# minute. Healthy sessions answer the probes and are not disturbed.
#
# Install (root, mode 600):
#   sudo install -m 600 scripts/mobile/sshd-shot-bridge.conf \
#        /etc/ssh/sshd_config.d/99-shot-bridge.conf
#   sudo sshd -t && sudo systemctl reload ssh    # reload, NOT restart: an
#                                                # sshd reload keeps every live
#                                                # connection (and the tunnel)
# Revert:
#   sudo rm /etc/ssh/sshd_config.d/99-shot-bridge.conf && sudo systemctl reload ssh
ClientAliveInterval 20
ClientAliveCountMax 3
TCPKeepAlive yes
