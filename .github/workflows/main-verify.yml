name: main-verify

# Gives every commit that lands on `main` a CI run — which a token-driven merge
# cannot get on its own. Full reasoning: `scripts/lib/main-verify.mjs`.
#
# `ci.yml` triggers on `push: branches: [main]`, and every commit on main is a
# squash merge performed by `merge-agent-pr` with the repository's GITHUB_TOKEN.
# GitHub suppresses workflow triggers for token-driven pushes ("with the
# exception of workflow_dispatch and repository_dispatch"), so that path never
# fires. Measured, not assumed: the last eight commits on main report no workflow
# run at all — only the PR head is ever verified, and the composition of two
# separately-green PRs is never checked together.
#
# `repository_dispatch` is one of the two exempt events, so `scripts/auto-merge.mjs`
# dispatches this after a successful merge. The gates are deliberately NOT
# re-listed here: the job calls `ci.yml` through `workflow_call`, so main runs the
# same suite from the same definition the PR ran, and no second list can drift.

on:
  repository_dispatch:
    types: [main-verify]
  # Manual re-verification of main, and exempt from the suppression for the same
  # reason the dispatch is.
  workflow_dispatch:

# Names the commit being verified, so a run is provably about a merge and not
# just "main at some point".
run-name: main-verify ${{ github.event.client_payload.sha || github.sha }}

permissions:
  contents: read
  # For the `notice` job below: the issue it files is how a red `main` stops
  # blocking the queue in silence. Granted here rather than on the job so there
  # is one place to look for what this run may do; the gates themselves still
  # declare `contents: read` on `ci.yml`, so this does not widen their reach.
  issues: write

concurrency:
  group: main-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    uses: ./.github/workflows/ci.yml

  # Report the result. The gate above can refuse a merge; it cannot tell anybody,
  # and for a long time it did not — a red `main` stalled the whole queue with no
  # issue, no annotation and no line anywhere a human would look, which is
  # indistinguishable from a slow runner or an agent that walked away. This job is
  # the sentence that was missing, and the durable record of it.
  #
  # `needs: gates` + `if: always()` is the load-bearing part: it must run when the
  # gate FAILED, which is the only case it exists for and the case a plain `if:`
  # would skip. It is a separate job rather than a step inside `ci.yml` so a
  # notification bug can fail loudly here without turning a green verification of
  # `main` red. Full reasoning: `scripts/lib/red-main-notice.mjs`.
  notice:
    needs: gates
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Report main's verification result
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_RESULT: ${{ needs.gates.result }}
        run: |
          # The job result is passed through verbatim rather than turned into
          # red/green here: `cancelled` and `skipped` must NOT be announced as a
          # broken `main` (a superseded verification is the normal state of this
          # workflow's concurrency group), and `scripts/lib/red-main-notice.mjs`
          # owns that mapping so this workflow and the merge driver cannot
          # disagree about what "red" means.
          node scripts/notify-main-red.mjs \
            --result="$GATE_RESULT" \
            --sha="${{ github.event.client_payload.sha || github.sha }}"
