name: work-queue

# The visible list of what is left, kept without a human triager.
#
# Regenerates WORK_QUEUE.md from live PR state daily and commits the result.
# The commit touches ONLY that file, is marked [queue-sync], and is pushed
# with GITHUB_TOKEN — whose pushes trigger no workflows (the same suppression
# main-verify exists for), so this cannot loop. Nudges stale owners in the
# same run. Manual: workflow_dispatch, or `node scripts/work-queue.mjs
# --write` from any checkout.

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: work-queue-sync
  cancel-in-progress: false

jobs:
  sync:
    name: sync-queue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Regenerate the queue
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/work-queue.mjs --write

      - name: Commit the sync (queue file only)
        run: |
          if git diff --exit-code -- WORK_QUEUE.md; then
            echo "queue fresh, nothing to commit"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add WORK_QUEUE.md
          git commit -m "[queue-sync] refresh WORK_QUEUE.md" -m "Generated by scripts/work-queue.mjs. Do not hand-edit; rerun --write."
          git push origin HEAD:main

      - name: Nudge stale owners
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/work-queue.mjs --nudge --post
