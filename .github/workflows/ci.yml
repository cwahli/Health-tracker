name: ci

# Evidence gate for PRs: typecheck + the repo's own fast named gates.
# Keeps agent output mergeable without running the whole ~97-file suite
# (per AGENTS.md: never `npm test`). Make this a required check on `main`
# via branch protection so a red run blocks merge.

on:
  pull_request:
    branches: [main]
  # `agent/**` is intentional: PRs opened by auto-pr.yml with GITHUB_TOKEN do not
  # fire `pull_request` workflows, so the agent's own push is what runs the gate
  # on the PR head SHA. See docs/agent/GITHUB_WORKFLOW.md.
  push:
    branches: [main, 'agent/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    name: tsc + named gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Agent identity on each new commit
        shell: bash
        run: |
          # Only the commits this change ADDS are its responsibility. An agent
          # branch that merges main (the normal thing on a long-lived branch)
          # would otherwise drag main's own commits into the range, and any of
          # them that predates this rule fails a branch that never touched it:
          # PR #250 went red on the commits of #232/#234 for exactly that
          # reason. `--not origin/<base>` drops everything the base already has.
          # It must be a separate argv word — git does not parse a "--not"
          # inside one quoted rev string, and the check would then see zero
          # commits and pass on the gate meant to catch a missing trailer.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base='${{ github.event.pull_request.base.ref }}'
            before='${{ github.event.pull_request.base.sha }}'
          else
            base='${{ github.event.repository.default_branch }}'
            before='${{ github.event.before }}'
            if [ "$before" = "0000000000000000000000000000000000000000" ]; then
              before=""
            fi
          fi
          git fetch --no-tags --quiet origin "$base"
          if [ -z "$before" ]; then
            before="$(git rev-parse "origin/$base")"
          fi
          scripts/check-agent-identity.sh \
            --range "$before..HEAD" \
            --not "origin/$base"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci --prefer-offline

      - name: Typecheck (tsc --noEmit)
        run: npm run lint

      - name: Prepush named gates (receptionist + bio + food)
        run: npm run test:prepush

      - name: Sync regression
        run: npm run test:sync

      # V-30.5 bug-ticket lane gates (plan/BUG_TICKET_PIPELINE.md §6.2).
      # ticket-state: derived S-C-lite projection stays pure.
      - name: Ticket state gate (bugTicketState)
        run: npx vitest run src/utils/bugTicketState.test.ts

      # pack-fixture: BUG-8449 fixture traceability + packer rules. Host-profile
      # bootstrap uses the committed fixture HOME on clean runners (CI-safe).
      - name: Bug pack fixture gate (assert-bug-pack)
        run: node scripts/assert-bug-pack.mjs

      # continuity: §4.10 route-shape + offline projection walk (no chat).
      - name: Bug ticket continuity gate (assert-bug-ticket-continuity)
        run: node scripts/assert-bug-ticket-continuity.mjs

      # capability: structural checks on every row, then the V-30.5 ticket-scoped
      # strict (the 5 foreign partials stay owned by BOT-11, never marked done).
      - name: Capability propagation gate (strict, ticket-scoped)
        run: |
          node scripts/check-capability-propagation.mjs
          node scripts/check-capability-propagation.mjs --strict --ids=svc-bug-ticket,proc-ticket-state,sess-ticket-resume,svc-repro

      # §4.10: the amnesia gate belongs in CI — answers from disk alone.
      - name: Bug retro-audit gate (§4.10 answers from disk)
        run: node scripts/assert-bug-retro-audit.mjs

      # ratchet: review-failures "dispatch:unresolved" repeat (hint=#5) → sensor
      # — the dispatcher must keep reading self-committed diffs as the fix.
      - name: Dispatch self-commit sensor (dispatch:unresolved ratchet)
        run: npx vitest run tests/dispatch-selfcommit.test.ts

      # 2026-09-25 cross-agent ticket-list mismatch → every agent's soul/skill
      # must pin the one canonical list read, fail loud, quote generated_at.
      - name: Ticket-list source sensor (cross-agent consistency)
        run: npx vitest run tests/soul-ticket-source.test.ts

      # 2026-09-25 card #8 stranded on journey/card-8 (pipeline is agent/**) →
      # dispatcher must mirror non-agent coder branches onto agent/dispatch-*.
      - name: Dispatch branch-scope sensor (journey/* → agent/** mirror)
        run: npx vitest run tests/dispatch-branch-scope.test.ts
