name: ci

# Evidence gate for PRs: typecheck + the repo's own fast named gates.
# Keeps agent output mergeable without running the whole ~97-file suite
# (per AGENTS.md: never `npm test`). Make this a required check on `main`
# via branch protection so a red run blocks merge.

on:
  pull_request:
    branches: [main]
  # `agent/**` is intentional: PRs opened by auto-pr.yml with GITHUB_TOKEN do not
  # fire `pull_request` workflows, so the agent's own push is what runs the gate
  # on the PR head SHA. See docs/agent/GITHUB_WORKFLOW.md.
  push:
    branches: [main, 'agent/**']
  # Reusable, so `main-verify.yml` can run this same job on `main` after a merge.
  # It has to be a call and not the `push` trigger above: every commit on main is
  # a squash merge written by `merge-agent-pr` with GITHUB_TOKEN, and GitHub
  # suppresses workflow triggers for token-driven pushes, so that `push: [main]`
  # path has never fired once. See `scripts/lib/main-verify.mjs`.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    name: tsc + named gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Author identity on each new commit
        shell: bash
        run: |
          # Only the commits this change ADDS are its responsibility. An agent
          # branch that merges main (the normal thing on a long-lived branch)
          # would otherwise drag main's own commits into the range, and any of
          # them that predates this rule fails a branch that never touched it:
          # PR #250 went red on the commits of #232/#234 for exactly that
          # reason. `--not origin/<base>` drops everything the base already has.
          # It must be a separate argv word — git does not parse a "--not"
          # inside one quoted rev string, and the check would then see zero
          # commits and pass on the gate meant to catch a missing trailer.
          #
          # Exception: a push TO main. The landed squash commit is minted by
          # GitHub from the PR title+body and was never checked as a branch
          # commit (seven trailer-less commits landed that way on 2026-09-27).
          # $before is the pre-push main, so before..HEAD is exactly what the
          # push added — it must be checked WITHOUT --not. With --not, the
          # fetch below advances origin/<base> past the push, the range goes
          # empty, and this gate is a no-op on the one path that needs it.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base='${{ github.event.pull_request.base.ref }}'
            before='${{ github.event.pull_request.base.sha }}'
            exclude_not=1
          elif [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            # main-verify (2026-09-29, #349). A repository_dispatch carries NO
            # `before`: the event is "verify main now", not "verify these
            # commits". So the pre-merge `before` fallback resolved to
            # origin/<base> == HEAD and the range came out EMPTY — the gate
            # printed "no new commits" and exited 0 without judging the merge
            # that had just landed. Every squash on main therefore went
            # unverified for author identity, which is the one thing this gate
            # exists for.
            #
            # The commit that landed is in client_payload.sha, and the parent of
            # that commit is the pre-merge base. Deriving `before` from the
            # merge's own parent is what makes the range the merge's commits,
            # whatever the event type is.
            base='${{ github.event.repository.default_branch }}'
            landed='${{ github.event.client_payload.sha }}'
            if [ -n "$landed" ]; then
              before="$(git rev-parse "$landed^" 2>/dev/null || true)"
            fi
            if [ -z "$before" ]; then
              # No usable payload: fall back to the branch tip's parent, which
              # is the same value for a single-commit main, and say so rather
              # than silently judging nothing.
              echo "::warning::no client_payload.sha; judging the tip commit of $base only"
              before="$(git rev-parse "origin/$base^" 2>/dev/null || true)"
            fi
            exclude_not=0
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            base='${{ github.event.repository.default_branch }}'
            before='${{ github.event.before }}'
            if [ "$before" = "0000000000000000000000000000000000000000" ]; then
              before=""
            fi
            exclude_not=0
          else
            base='${{ github.event.repository.default_branch }}'
            before='${{ github.event.before }}'
            if [ "$before" = "0000000000000000000000000000000000000000" ]; then
              before=""
            fi
            exclude_not=1
          fi
          git fetch --no-tags --quiet origin "$base"
          if [ -z "$before" ]; then
            before="$(git rev-parse "origin/$base")"
          fi
          if [ "$exclude_not" = "1" ]; then
            # A PR whose commits are all already on the base (a re-push, or a
            # branch merged from elsewhere) really does have nothing to judge.
            # That is the ONLY caller allowed to say so; see --allow-empty.
            scripts/check-agent-identity.sh \
              --range "$before..HEAD" \
              --not "origin/$base" \
              --allow-empty
          else
            # A push to main, or a post-merge main-verify. No --allow-empty: an
            # empty range here means the range was wrong, not that there was
            # nothing to check.
            scripts/check-agent-identity.sh \
              --range "$before..HEAD"
          fi

      # A merge may not silently erase landed work (#143 re-added a file a later
      # PR had deleted; five empty squashes re-landed what was already on
      # main; #371 hand-reverted a hunk to dodge overlap). scripts/no-undo.mjs
      # judges the same range as the identity gate above: deleted lines/files
      # and resurrected files owned by landed commits fail unless the judged
      # body declares `Reverts: <sha>` / `Resurrects: <path>`. On PR runs the
      # body is the PR body; on post-merge runs it is the squash message,
      # which carries the PR body since the squash keeps it (#377).
      - name: Landed-work preservation (no silent undo)
        if: github.event_name == 'pull_request' || github.event_name == 'repository_dispatch'
        shell: bash
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # PR and post-merge runs only — same gating as the contract steps.
          # A push run has no PR body (its event carries none), and judging
          # commit messages there would fail work the PR body already declares
          # (proven on this step's own PR: push run red, PR run green on the
          # same head). Single-push branches are covered post-merge instead.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base='${{ github.event.pull_request.base.ref }}'
            before='${{ github.event.pull_request.base.sha }}'
            printf '%s\n' "$PR_BODY" > "$RUNNER_TEMP/no-undo-body.txt"
          elif [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            base='${{ github.event.repository.default_branch }}'
            landed='${{ github.event.client_payload.sha }}'
            if [ -n "$landed" ]; then
              before="$(git rev-parse "$landed^" 2>/dev/null || true)"
            fi
            if [ -z "$before" ]; then
              before="$(git rev-parse "origin/$base^" 2>/dev/null || true)"
            fi
            git log -1 --format=%B "$landed" > "$RUNNER_TEMP/no-undo-body.txt" 2>/dev/null || : > "$RUNNER_TEMP/no-undo-body.txt"
          else
            base='${{ github.event.repository.default_branch }}'
            before='${{ github.event.before }}'
            if [ "$before" = "0000000000000000000000000000000000000000" ]; then
              before=""
            fi
            git log --format=%B "$before..HEAD" > "$RUNNER_TEMP/no-undo-body.txt" 2>/dev/null || : > "$RUNNER_TEMP/no-undo-body.txt"
          fi
          git fetch --no-tags --quiet origin "$base"
          if [ -z "$before" ]; then
            before="$(git rev-parse "origin/$base")"
          fi
          node scripts/no-undo.mjs --range "$before..HEAD" --landed-ref "origin/$base" --body-file "$RUNNER_TEMP/no-undo-body.txt"

      - name: No-undo sensor (preservation rule fails closed)
        run: node scripts/assert-no-undo.test.mjs

      # The gate above judges only what a change ADDS, so a commit that landed
      # while its range was wrong is never re-judged — and stays wrong
      # invisibly. This walks EVERY commit on the base and fails on debt that is
      # not recorded in scripts/author-trail-debt.txt. Measured 2026-09-29: 35
      # of 1350 commits, so this is a ratchet over real debt, not a red gate.
      - name: Author trail backfill audit (unjudged debt on the base)
        run: node scripts/assert-author-trail.mjs --base="origin/${{ github.event.repository.default_branch }}"

      - name: Author identity in PR body (becomes the squash message)
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # GitHub mints the landed squash commit from the PR title+body, and
          # nothing re-checks that message afterwards (see above). Requiring
          # the trailer in the body makes it flow into main automatically —
          # no manual paste into the squash box. Pattern is owned by
          # scripts/check-agent-identity.sh; --message reuses it directly.
          printf '%s\n' "$PR_BODY" > "$RUNNER_TEMP/pr-body.txt"
          scripts/check-agent-identity.sh --message "$RUNNER_TEMP/pr-body.txt"

      - name: PR body contract (summary/status/left)
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # Every PR carries a blurb a human can review: what it does, its
          # progress status, and what is left. Pattern is owned by
          # scripts/assert-pr-summary.mjs (trailer + ## Summary/Status/Left).
          node scripts/assert-pr-summary.mjs

      - name: 'PR body contract sensor (Next: pointer fails closed)'
        run: node scripts/assert-pr-summary.test.mjs

      - name: Work queue sensor (generated list fails closed)
        run: node scripts/assert-work-queue.test.mjs

      # A manual merge (laptop `gh pr merge`, web UI) bypasses the driver:
      # no commit_message is sent, so the squash body falls back to the
      # branch's commit list and ## Left never reaches git log. The PR runs
      # above cannot see this — the body was fine, the minted message is
      # not. Judge the LANDED message on push-to-main instead, loudly: the
      # red-main notice machinery reports it the same way. Auto-merges
      # always satisfy (the driver sends title+body); [queue-sync] commits
      # are exempt in the binary itself.
      - name: Landed message keeps the handover (manual-merge backstop)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git log -1 --format=%B HEAD > "$RUNNER_TEMP/landed.txt"
          PR_BODY="$(cat "$RUNNER_TEMP/landed.txt")" node scripts/assert-pr-summary.mjs

      - name: PR must add net change vs base (no empty merges)
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        shell: bash
        run: |
          # Stale branches whose work already landed elsewhere squash-merge
          # into empty no-op commits with misleading fix/feat messages (five
          # such commits landed on 2026-09-27). Fail fast instead. Rebase long-
          # lived branches; do not merge main into them (a pure main-merge
          # also reads as empty here — that is intentional).
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base='${{ github.event.pull_request.base.ref }}'
          else
            base='${{ github.event.repository.default_branch }}'
          fi
          git fetch --no-tags --quiet origin "$base"
          if [ -z "$(git diff --stat "origin/$base...HEAD" --)" ]; then
            echo "No net change vs $base. Close the PR, or rebase the branch" >&2
            echo "onto origin/$base so it carries exactly its own work." >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci --prefer-offline

      - name: Typecheck (tsc --noEmit)
        run: npm run lint

      - name: Prepush named gates (receptionist + bio + food)
        run: npm run test:prepush

      - name: Sync regression
        run: npm run test:sync

      # The registry's inheritance contract. Every bot-host bot is a thin clone
      # of the master (`bots/registry.json` "master"), so one edit to the master
      # reaches the fleet and a new bot cannot quietly re-copy (and later drift
      # from) the shared surfaces. The sensor drives each failing fixture, so a
      # gate that never fires is itself caught.
      - name: Bot clone contract (assert-bot-clone)
        run: |
          node scripts/assert-bot-clone.mjs
          node scripts/assert-bot-clone.test.mjs
          node scripts/add-bot.test.mjs
          npx vitest run tests/registry-inherit.test.ts

      # The forge creates a bot end to end. The sensor drives the whole paste
      # path against a scratch tree and a fake Bot API (a real child process and
      # real sockets), so a create that half-finishes — a row with no token, a
      # token with no unit, an enabled bot whose token never answered — fails
      # here instead of on the host.
      - name: Bot forge gate (assert-bot-forge)
        run: node scripts/assert-bot-forge.test.mjs

      # The PM role projects the fleet from records that already exist and climbs
      # the retry -> find-another-way -> escalate ladder. The sensor spawns the
      # real bot-host three times (three processes, so the attempt counters must
      # survive a restart) against a fixture fleet, and drives the two cases the
      # ladder must NOT fire on: a fresh failure, and a stale failure whose agent
      # is still alive.
      - name: PM role gate (assert-pm-role)
        run: node scripts/assert-pm-role.test.mjs

      # The model failover chain ran nowhere in CI, which is how the 2026-10-05
      # outage shipped: `defaultIsRetryable` treated a timeout as terminal, so a
      # dead primary lane held the turn for its full 900s budget and returned
      # empty — "Done (exit 1), but the model returned no text output." — while
      # the healthy fallback already in the chain was never attempted. The gate
      # existed and passed 15/15 locally; it just was never run here. Its timeout
      # case drives the real timer, and needs only node: builtins, so it is safe
      # in a checkout with no node_modules.
      #
      # HOME is pinned because bot-host creates ~/.hermes as an import side
      # effect, and assert-bug-pack treats "does ~/.hermes exist" as "am I on a
      # real host?" — with a shared HOME this step silently flipped that gate to
      # the real-profile path (3 failures) purely by running earlier. Keep the
      # step hermetic so it neither depends on nor perturbs the gates around it.
      - name: Model failover gate (assert-model-failover)
        run: HOME="$(mktemp -d)" node scripts/assert-model-failover.mjs

      # The group surfaces ran nowhere in CI, which is how #458 merged green
      # while main was red: two bots were seated as health_analyst and two as
      # test_planner, and assert-health-group — the sensor that refuses exactly
      # that — was only ever run by hand. A sensor nobody runs is a comment.
      # assert-tax-group prints one SKIP line on a runner (the operator's books
      # are not in git); a skip is visible, a green line it never earned is not.
      - name: Group seats gate (health + tax)
        run: |
          node scripts/assert-health-group.test.mjs
          node scripts/assert-tax-group.test.mjs
          node scripts/assert-chat-scope.test.mjs
          node scripts/assert-project-registry-parity.mjs

      - name: Token sync gate (assert-sync-tokens)
        run: node scripts/assert-sync-tokens.test.mjs

      # The health workspace is a data workspace — `result/` and `sources/`, no
      # brief — and the brief is committed with the pack in the repo. Roles
      # already resolve that way; the brief did not, so buildHealthContext
      # answered ok:false for the project's own workspace and every seat
      # (/health analyze, /health doctor, the whole room) refused before the
      # model was called. This gate pins both halves: the project's own
      # workspace falls back to its pack, and no other directory may.
      - name: Seat brief gate (assert-health-brief)
        run: node scripts/assert-health-brief.mjs

      # A seat's model is host config, not this repo's opinion. The lane was
      # pinned to one vendor in three places at once — COUNCIL_MODEL defaulted to
      # a Gemini id, the readiness gate asked geminiKeyIn(), and runGemini
      # rejected any id outside GEMINI_MODELS — so `/health readiness` reported
      # "No model credential on this host" on a box whose Telegram bot answered
      # all day and whose catalog listed 72 lanes. Seats now take the host's own
      # lanes, free first, walking them with the bot's failover.
      - name: Seat model gate (assert-seat-model)
        run: node scripts/assert-seat-model.mjs

      # The coder build gate must never be fooled by the npm `tsc` decoy: when a
      # worktree has no local compiler, `npx tsc` resolves version 2.0.4 of the
      # package named `tsc`, whose only output is "This is not the tsc command
      # you are looking for". The gate read that as a build failure and blamed
      # the agent (card #19, four identical nudges against an environment that
      # no retry could fix). Executed here so the sensor is a gate, not decor.
      - name: Dispatch toolchain gate (assert-dispatch-toolchain)
        run: node scripts/assert-dispatch-toolchain.mjs

      # A bot's name is the bot's name. In-progress seat work on a serving tree
      # renamed four bots to their health chairs (vm2 read "Data Steward") so the
      # @ menu would resolve @research, which overwrites how the operator
      # identifies those bots everywhere else in Telegram. Operator rule
      # 2026-10-02: the seat is the in-group tag, never the name.
      # The seat tag writer. A Telegram custom title can only exist on an admin,
      # so writing one means promoting the member — a decision about what a bot
      # may DO in that group. The writer refuses without rights the caller states
      # explicitly, previews by default, and never demotes anyone by sending a
      # minimal admin record. 36 cases, all against fixtures: no network, no
      # group, nothing it could mutate even if it tried.
      - name: Seat tag writer gate (tag, never a rename, never an invented right)
        run: node scripts/assert-seat-tag-writer.mjs

      - name: Bot identity gate (nothing renames a bot)
        run: node scripts/assert-bot-names.mjs

      # A test that drives the real dispatcher must not post to the operator's
      # chat. It did: every run of bugPackFixtures put real "[Orchestrator]
      # Dispatch rejected for BUG-TEST" messages in that chat, which read as a
      # pipeline incident and were a fixture's deliberate refusal.
      - name: Dispatch quiet gate (a test must not post to the chat)
        run: node scripts/assert-dispatch-quiet.mjs

      # The merge gate that protects this branch. `auto-merge` used to merge PRs
      # whose required checks had FAILED (#340 raced ahead of CI; #346 landed with
      # `tsc + named gates` red in both runs). The sensor drives the decision
      # through every case AND spawns the real driver against a fake GitHub API,
      # asserting on what the fake was actually asked to do: a red or unreported
      # required check must never produce a merge call.
      - name: Merge gate (assert-auto-merge)
        run: node scripts/assert-auto-merge.test.mjs

      # The merge gate above protects the PR. This one protects `main`: a
      # GITHUB_TOKEN squash merge triggers no workflow, so the driver dispatches
      # the post-merge run explicitly. The sensor proves the dispatch is sent,
      # that it names the merge commit, and that a dispatch with nowhere to land
      # stops the merge instead of riding along with it.
      - name: Main verification wiring (assert-main-verify)
        run: node scripts/assert-main-verify.test.mjs

      # V-30.5 bug-ticket lane gates (plan/BUG_TICKET_PIPELINE.md §6.2).
      # ticket-state: derived S-C-lite projection stays pure.
      - name: Ticket state gate (bugTicketState)
        run: npx vitest run src/utils/bugTicketState.test.ts

      # pack-fixture: BUG-8449 fixture traceability + packer rules. Host-profile
      # bootstrap uses the committed fixture HOME on clean runners (CI-safe).
      - name: Bug pack fixture gate (assert-bug-pack)
        run: node scripts/assert-bug-pack.mjs

      # continuity: §4.10 route-shape + offline projection walk (no chat).
      - name: Bug ticket continuity gate (assert-bug-ticket-continuity)
        run: node scripts/assert-bug-ticket-continuity.mjs

      # One row set and one number per card across the board and `bugctl list`
      # (#391). These two need `tsx` from node_modules, so they live here and
      # NOT above the Install step — the count-parity sensor shipped in #391 was
      # never wired into CI at all, which is why it could not have caught that.
      - name: Bug ticket count parity sensor (board == list)
        run: node scripts/assert-bug-ticket-count-parity.mjs

      # The board's own numbers must be true: an ignored card read "fixed" and
      # counted as done, and a write from the agent left a stale card count on
      # screen for 20s. Same class as the two row sets.
      - name: Bug board truth sensor (dispositions + cache invalidation)
        run: node scripts/assert-bug-board-truth.mjs
      # Meal QA loop (plan/MEAL_QA_LOOP.md). Four ratchets, all offline.
      # resolve: saved meals stay reachable — the three provenance tiers and the
      #   no-overclaim guard on photo_only edit-history observability.
      # ticket:  a comparison FAIL still becomes exactly one card (V-29), with a
      #   mechanical criteria and idempotent idem-keys.
      # loop:    the driver stays bounded, per-card capped, author != verifier.
      # assist:  refuses to invent nutrients rather than emit false findings.
      # handoff:  the loop actually queues work for the meal-audit agent, and a
      #   completed hand-off is adopted rather than re-fetched.
      - name: Meal audit loop gates (resolve, ticket, loop, assist, handoff)
        run: |
          node scripts/assert-meal-audit-resolve.mjs
          node scripts/assert-meal-audit-ticket.mjs
          node scripts/assert-meal-audit-loop.mjs
          node scripts/assert-meal-audit-assist.mjs
          node scripts/assert-meal-audit-handoff.mjs

      # The audit-only nutrient route the meal-audit agent reads from. Pins that it
      # serves active rows only, returns per-100g values unscaled, clamps its limit,
      # and reaches no user data.
      - name: Audit food-nutrients route contract
        run: npx vitest run server_audit_food_nutrients.test.ts

      # capability: structural checks on every row, then the V-30.5 ticket-scoped
      # strict (the 5 foreign partials stay owned by BOT-11, never marked done).
      - name: Capability propagation gate (strict, ticket-scoped)
        run: |
          node scripts/check-capability-propagation.mjs
          node scripts/check-capability-propagation.mjs --strict --ids=svc-bug-ticket,proc-ticket-state,sess-ticket-resume,svc-repro

      # User-visible command surface: every canonical command needs an explicit
      # per-class verdict, and the Grok TG router's popup must match its handlers.
      # /tui shipped missing on the router because the DECLARE step (§14.7) was
      # skipped and nothing checked command-level truth.
      - name: Command scope gate (popup == handlers == declared)
        run: node scripts/assert-command-scope.mjs

      - name: Command scope gate unit tests
        run: node --test scripts/assert-command-scope.test.mjs

      # /project aliases are duplicated between bot-host's project-registry and
      # the standalone router's copy. The router cannot import scripts/ (it ships
      # standalone), so this pins the shared grammar against silent drift — the
      # same class of failure as /tui going missing unnoticed.
      - name: Project alias parity gate (bot-host vs router)
        run: node scripts/assert-project-registry-parity.mjs

      # /tui used to open an OpenCode terminal no matter which provider was
      # answering: live on 2026-09-30 the chat's provider was Cline (Muse Spark
      # 1.3), so the TUI showed a different model and a different conversation.
      # The provider -> attach mapping, the per-chat Cline task store, and the
      # ACP resume driver now live in the standalone router, whose suite ran
      # nowhere in CI. These three files are dependency-free, so they run here
      # without installing the router's own node_modules.
      - name: Router TUI-provider gates (mapping, task store, ACP resume)
        run: |
          cd tools/telegram-provider-router
          node scripts/test-tui-provider.mjs
          node scripts/test-provider-sessions.mjs
          node scripts/test-cline-acp.mjs

      # §4.10: the amnesia gate belongs in CI — answers from disk alone.
      - name: Bug retro-audit gate (§4.10 answers from disk)
        run: node scripts/assert-bug-retro-audit.mjs

      # ratchet: review-failures "dispatch:unresolved" repeat (hint=#5) → sensor
      # — the dispatcher must keep reading self-committed diffs as the fix.
      - name: Dispatch self-commit sensor (dispatch:unresolved ratchet)
        run: npx vitest run tests/dispatch-selfcommit.test.ts

      # 2026-09-25 cross-agent ticket-list mismatch → every agent's soul/skill
      # must pin the one canonical list read, fail loud, quote generated_at.
      - name: Ticket-list source sensor (cross-agent consistency)
        run: npx vitest run tests/soul-ticket-source.test.ts

      # 2026-09-25 card #8 stranded on journey/card-8 (pipeline is agent/**) →
      # dispatcher must mirror non-agent coder branches onto agent/dispatch-*.
      - name: Dispatch branch-scope sensor (journey/* → agent/** mirror)
        run: npx vitest run tests/dispatch-branch-scope.test.ts

      # shot bridge: one phone screenshot pulled by two agents at once must land
      # as ONE file (it used to write shot-X.png + shot-X-2.png), and a 401 must
      # never read as "the phone has no screenshots". Real client against a real
      # server on a loopback port in a throwaway cache — no phone, no tunnel.
      - name: Screenshot bridge gate (scripts/mobile/test-pull-shot.sh)
        run: bash scripts/mobile/test-pull-shot.sh

      # /tui was the one surface whose sensors ran nowhere: 60+ cases lived on
      # a laptop while main served a broken page, twice (2026-09-28, 2026-09-29).
      # These are the cases that must stay green or the phone finds out first.
      - name: TUI gateway gate (assert-tui-gateway)
        run: node scripts/assert-tui-gateway.test.mjs

      - name: TUI chat-select gate (assert-tui-chat-select)
        run: bash scripts/assert-tui-chat-select.test.sh

      # The ratchet for the class, not the symptom: a TUI fix that is committed
      # but never merged. Both halves of that gate are proven in its own sensor
      # against throwaway repos — a gate never seen red is a gate nobody trusts.
      - name: TUI fixes-landed ratchet (unlanded branch is a regression)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/assert-tui-fixes-landed.test.mjs
          # A branch with an open PR is being worked, not stranded — that is the
          # opposite of an unlanded fix reading as a done fix. The gate makes no
          # network call, so the names are supplied here. If `gh` fails the list
          # is empty and NOBODY is exempt: an API outage must not pass work.
          OPEN_PRS="$(gh pr list --state open --limit 100 --json headRefName \
            --jq '.[].headRefName' 2>/dev/null | paste -sd, - || true)"
          # The base is the branch under test, not a name this file hardcodes:
          # a PR's own head must not be judged against itself.
          node scripts/assert-tui-fixes-landed.mjs \
            --open-pr-branches="$OPEN_PRS" \
            --base="origin/${{ github.event.repository.default_branch }}"
