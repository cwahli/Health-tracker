name: auto-merge

# Merges an `agent/**` PR with the repository's GITHUB_TOKEN once its REQUIRED
# checks have concluded `success` — the agent lands its own work with no PAT and
# no human click. The merge releases the "open PR is the lock" claim and deletes
# the branch.
#
# FAIL CLOSED. This job used to wait for checks to stop being *pending* and then
# merge, which merged two red PRs:
#   - PR #340 merged while `tsc + named gates` was still running; it concluded
#     `failure` 66s later.
#   - PR #346 merged with `tsc + named gates` already `failure` in both runs
#     (the commit had no author trailer).
# "Not pending" was read as "green", and a check that did not exist yet was not
# pending either — so a fast push merged before CI had started. The decision now
# lives in `scripts/lib/merge-gate.mjs` (pure, and driven by
# `scripts/assert-auto-merge.test.mjs`): a missing, running, or failed required
# check blocks the merge, and only all-success merges. The required set is the
# pair `docs/agent/GITHUB_WORKFLOW.md` §3a names for branch protection — which is
# an owner-only setting this repo has OFF, so this job is the enforcement.
#
# Triggered on the agent's own push (the same event that opens the PR via
# auto-pr.yml and runs ci/claim-guard). The driver waits for those checks to
# conclude, so a push that races ahead of CI is now a wait, never a merge.
# If branch protection is ever enabled and requires a human review, the merge is
# rejected and the reason is posted as a PR comment.

on:
  push:
    branches: ['agent/**']
  # A red `main` blocks the next merge — which would also block the PR that fixes
  # it, because the only way to change `main` is to merge. This is the operator's
  # explicit way out: pick the PR, say you mean it, and the override is recorded on
  # the run and on the PR. It is never reached by a timeout or by the driver's own
  # judgement. Full reasoning: `scripts/lib/merge-gate.mjs`.
  workflow_dispatch:
    inputs:
      pr:
        description: 'Pull request number to merge'
        required: true
        type: string
      allow_red_main:
        description: "Merge even though main's post-merge verification is red — for landing the fix"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    name: merge-agent-pr
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Merge only when the required checks have concluded successfully
        env:
          GH_TOKEN: ${{ github.token }}
          ALLOW_RED_MAIN: ${{ inputs.allow_red_main && '1' || '' }}
        run: node scripts/auto-merge.mjs ${{ inputs.pr && format('--pr={0}', inputs.pr) || '' }}
