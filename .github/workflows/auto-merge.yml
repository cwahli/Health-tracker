name: auto-merge

# Merges an `agent/**` PR once its required checks are green, using the
# repository's GITHUB_TOKEN — the agent lands its own work with no PAT and no
# human click. The merge releases the "open PR is the lock" claim and deletes
# the branch.
#
# Triggered on the agent's own push (the same event that opens the PR via
# auto-pr.yml and runs ci/claim-guard). It waits on the *required* checks only,
# so a non-required external check (e.g. an unused Cloudflare Workers build)
# cannot block the merge.
#
# If branch protection requires a human review, the merge is rejected and this
# job annotates a warning — the PR stays open for a human.

on:
  push:
    branches: ['agent/**']

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    name: merge-agent-pr
    runs-on: ubuntu-latest
    steps:
      - name: Merge once required checks pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          BRANCH="${GITHUB_REF_NAME}"

          # auto-pr.yml runs on the same push; wait briefly for its PR.
          me=""
          for _ in $(seq 1 20); do
            me="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number' 2>/dev/null || true)"
            if [ -n "$me" ] && [ "$me" != "null" ]; then break; fi
            sleep 3
          done
          if [ -z "$me" ] || [ "$me" = "null" ]; then
            echo "auto-merge: no open PR for $BRANCH; nothing to do."
            exit 0
          fi

          # Wait for the required checks (no-op when branch protection defines
          # none). Non-required checks are intentionally not waited on.
          gh pr checks "$me" --required --watch --fail-fast || true

          if out="$(gh pr merge "$me" --squash --delete-branch 2>&1)"; then
            echo "auto-merge: merged PR #$me: $out"
          else
            echo "::warning title=auto-merge::could not merge #$me: $out"
          fi
