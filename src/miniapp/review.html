<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Review Queue</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --gutter: clamp(12px, 3vw, 28px); }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0 0 clamp(16px, 4vw, 40px) 0;
    background: #0f172a; color: #e2e8f0;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-text-size-adjust: 100%; line-height: 1.5;
  }
  .masthead {
    position: sticky; top: 0; z-index: 30;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: #0f172a; padding: 8px var(--gutter); margin: 0;
    border-bottom: 1px solid #334155;
  }
  .title-group { display: flex; align-items: center; gap: 8px; }
  h1 { color: #f8fafc; font-size: clamp(18px, 3.5vw, 24px); margin: 0; }
  .live-dot { width: 8px; height: 8px; border-radius: 50%; background: #10b981; box-shadow: 0 0 6px #10b981; }
  .btn-refresh {
    background: #1e293b; border: 1px solid #334155; color: #93c5fd;
    border-radius: 6px; padding: 2px 7px; font-size: 13px; cursor: pointer;
    line-height: 1.2; display: inline-flex; align-items: center; justify-content: center;
    transition: background 0.15s, transform 0.15s; user-select: none;
  }
  .btn-refresh:hover { background: #334155; }
  .btn-refresh.spinning { animation: spin 0.8s linear infinite; pointer-events: none; opacity: 0.7; }
  @keyframes spin { 100% { transform: rotate(360deg); } }
  .pager { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: #93c5fd; }
  .pager button {
    background: #1e293b; border: 1px solid #334155; color: #93c5fd;
    border-radius: 6px; padding: 4px 10px; font-size: 14px; cursor: pointer;
  }
  .pager button:disabled { opacity: 0.35; }
  .card { padding: 12px var(--gutter); }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 10px; }
  .chip {
    display: inline-block; padding: 2px 8px; border-radius: 9999px;
    font-size: 11px; font-weight: 600; background: #1e293b; color: #93c5fd;
    border: 1px solid #334155; overflow-wrap: anywhere;
  }
  .chip-key { color: #7dd3fc; }
  .chip-gate { color: #fbbf24; border-color: #854d0e; }
  .gallery {
    display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain;
    border: 1px solid #334155; border-radius: 10px; background: #000;
    padding: 8px;
  }
  .gallery figure { margin: 0; flex: 0 0 100%; scroll-snap-align: center; }
  .gallery img {
    width: 100%; max-height: 52vh; object-fit: contain; display: block;
    border-radius: 6px; background: #000;
  }
  .gallery figcaption { text-align: center; font-size: 12px; color: #94a3b8; padding-top: 4px; }
  .noproof {
    border: 1px dashed #475569; border-radius: 10px; padding: 20px;
    text-align: center; color: #94a3b8; font-size: 13px;
  }
  .panel {
    background: #1e293b; border: 1px solid #334155; border-radius: 10px;
    padding: 10px 12px; margin-top: 10px;
  }
  .panel h3 {
    margin: 0 0 6px; font-size: 11px; text-transform: uppercase;
    letter-spacing: .06em; color: #93c5fd;
  }
  .panel.request { border-color: #1d4ed8; }
  .panel.request h3 { color: #bfdbfe; }
  .panel p { margin: 0; font-size: 14px; color: #e2e8f0; white-space: pre-wrap; overflow-wrap: break-word; }
  .panel.context p { font-size: 13px; color: #cbd5e1; }
  details.panel { padding: 10px 12px; }
  details.panel summary { cursor: pointer; font-size: 12px; color: #93c5fd; font-weight: 600; }
  .actions {
    position: sticky; bottom: 0; background: #0f172a;
    border-top: 1px solid #334155; padding: 10px var(--gutter) calc(10px + env(safe-area-inset-bottom));
    margin-top: 12px;
  }
  .seg { display: flex; gap: 0; margin-bottom: 8px; }
  .seg button {
    flex: 1; cursor: pointer; padding: 7px 6px; font-size: 12px; font-weight: 600;
    color: #93c5fd; background: #1e293b; border: 1px solid #334155; margin-left: -1px;
  }
  .seg button:first-child { border-radius: 8px 0 0 8px; margin-left: 0; }
  .seg button:last-child { border-radius: 0 8px 8px 0; }
  .seg button.on { background: #1d4ed8; color: #fff; border-color: #1e40af; }
  textarea {
    width: 100%; min-height: 64px; resize: vertical;
    background: #1e293b; border: 1px solid #334155; border-radius: 8px;
    color: #e2e8f0; font-size: 14px; padding: 8px 10px; font-family: inherit;
  }
  .row { display: flex; gap: 8px; margin-top: 8px; }
  .btn {
    border: none; border-radius: 8px; padding: 10px 14px;
    font-size: 14px; font-weight: 700; cursor: pointer;
  }
  .btn-approve { background: #065f46; color: #a7f3d0; border: 1px solid #059669; flex: 1; }
  .btn-approve.confirm { background: #b45309; color: #fff; border-color: #f59e0b; }
  .btn-send { background: #1d4ed8; color: #fff; flex: 1; }
  .btn:disabled { opacity: 0.5; }
  .toast {
    position: fixed; left: 50%; bottom: 120px; transform: translateX(-50%);
    background: #1e293b; border: 1px solid #334155; color: #f8fafc;
    border-radius: 8px; padding: 8px 14px; font-size: 13px; z-index: 50;
    max-width: 90vw; text-align: center;
  }
  .empty { text-align: center; padding: 48px var(--gutter); color: #94a3b8; }
  .empty .big { font-size: 40px; }
  .lightbox {
    position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.94);
    display: none; align-items: center; justify-content: center;
  }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 100vw; max-height: 100vh; object-fit: contain; }
</style>
</head>
<body>
<div class="masthead">
  <div class="title-group">
    <span class="live-dot" id="live-indicator" title="Connected"></span>
    <h1>Review</h1>
    <button id="btn-refresh" class="btn-refresh" title="Refresh queue" aria-label="Refresh queue">🔄</button>
  </div>
  <div class="pager">
    <button id="btn-prev" aria-label="Previous item">‹</button>
    <span id="pos">0/0</span>
    <button id="btn-next" aria-label="Next item">›</button>
  </div>
</div>

<div id="body"></div>
<div class="lightbox" id="lightbox"><img id="lightbox-img" alt="proof fullscreen"></div>

<script>
(function () {
  if (window.Telegram && window.Telegram.WebApp) {
    try {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    } catch (e) {}
  }

  var state = { items: [], idx: 0, target: 'left', approving: false };
  var query = location.search || '';

  function esc(s) {
    if (s === null || s === undefined || s === '') return '<span style="color:#64748b">—</span>';
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function toast(msg) {
    var old = document.querySelector('.toast');
    if (old) old.remove();
    var t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 3200);
  }

  function proofUrl(key, fileId) {
    var q = query ? query + '&' : '?';
    return '/review/api/proof' + q + 'key=' + encodeURIComponent(key) + '&file=' + encodeURIComponent(fileId);
  }

  function render() {
    var body = document.getElementById('body');
    var prev = document.getElementById('btn-prev');
    var next = document.getElementById('btn-next');
    document.getElementById('pos').textContent = state.items.length ? ((state.idx + 1) + '/' + state.items.length) : '0/0';
    prev.disabled = state.idx <= 0;
    next.disabled = state.idx >= state.items.length - 1;
    if (!state.items.length) {
      body.innerHTML = '<div class="empty"><div class="big">🎉</div><p>No items awaiting review.<br>Agents set Status to <b>review</b> when work is ready for human eyes.</p></div>';
      return;
    }
    var it = state.items[state.idx];
    var proofs = it.proofs || [];
    var gal = proofs.length
      ? '<div class="gallery">' + proofs.map(function (p, i) {
          return '<figure><img src="' + proofUrl(it.key, p.id) + '" alt="proof ' + (i + 1) + '" loading="lazy" data-full="' + proofUrl(it.key, p.id) + '">' +
            '<figcaption>' + esc(p.name) + ' · ' + (i + 1) + '/' + proofs.length + '</figcaption></figure>';
        }).join('') + '</div>'
      : '<div class="noproof">No proof screenshots filed yet.<br>Ask the agent to file screenshots before approving.</div>';
    body.innerHTML =
      '<div class="card">' +
        '<div class="meta">' +
          '<span class="chip chip-key">' + esc(it.key) + '</span>' +
          (it.ref ? '<span class="chip">' + esc(it.ref) + '</span>' : '') +
          '<span class="chip">' + esc(it.owner || 'unowned') + '</span>' +
          '<span class="chip">' + esc(it.lastActivity || '') + '</span>' +
        '</div>' +
        (it.gate ? '<div class="meta"><span class="chip chip-gate">gate: ' + esc(it.gate) + '</span></div>' : '') +
        gal +
        '<div class="panel request"><h3>Original request</h3><p>' + esc(it.originalRequest) + '</p></div>' +
        '<details class="panel context"><summary>Work done so far</summary><p>' + esc(it.workDone) + '</p></details>' +
        '<details class="panel context"><summary>What\u2019s left to do</summary><p id="whatsleft">' + esc(it.whatsLeft) + '</p></details>' +
        '<div class="actions">' +
          '<div class="seg" role="tablist" aria-label="Comment target">' +
            '<button id="seg-left" class="' + (state.target === 'left' ? 'on' : '') + '">↩ What\u2019s left (proof wrong)</button>' +
            '<button id="seg-original" class="' + (state.target === 'original' ? 'on' : '') + '">＋ Original request (new feature)</button>' +
          '</div>' +
          '<textarea id="comment" placeholder="Comment for the agent\u2026"></textarea>' +
          '<div class="row">' +
            '<button class="btn btn-approve" id="btn-approve">👍 Done</button>' +
            '<button class="btn btn-send" id="btn-send">Send ➤</button>' +
          '</div>' +
        '</div>' +
      '</div>';

    document.getElementById('seg-left').addEventListener('click', function () { state.target = 'left'; render(); });
    document.getElementById('seg-original').addEventListener('click', function () { state.target = 'original'; render(); });
    document.getElementById('btn-approve').addEventListener('click', onApprove);
    document.getElementById('btn-send').addEventListener('click', onSend);
    body.querySelectorAll('.gallery img').forEach(function (img) {
      img.addEventListener('click', function () {
        document.getElementById('lightbox-img').src = img.getAttribute('data-full');
        document.getElementById('lightbox').classList.add('open');
      });
    });
  }

  document.getElementById('lightbox').addEventListener('click', function () {
    this.classList.remove('open');
    document.getElementById('lightbox-img').src = '';
  });
  document.getElementById('btn-prev').addEventListener('click', function () {
    if (state.idx > 0) { state.idx -= 1; state.approving = false; render(); }
  });
  document.getElementById('btn-next').addEventListener('click', function () {
    if (state.idx < state.items.length - 1) { state.idx += 1; state.approving = false; render(); }
  });

  function api(path, opts) {
    var url = path + query;
    return fetch(url, opts).then(function (res) { return res.json().then(function (j) { return { status: res.status, body: j }; }); });
  }

  function onApprove() {
    var btn = document.getElementById('btn-approve');
    var it = state.items[state.idx];
    if (!it) return;
    if (!state.approving) {
      state.approving = true;
      btn.textContent = 'Tap again to archive ✅';
      btn.classList.add('confirm');
      return;
    }
    btn.disabled = true;
    btn.textContent = 'Archiving…';
    api('/review/api/approve', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key: it.key }),
    }).then(function (r) {
      if (r.body && r.body.ok) {
        toast('Archived ✅ ' + it.key);
        state.items.splice(state.idx, 1);
        if (state.idx >= state.items.length) state.idx = Math.max(0, state.items.length - 1);
        state.approving = false;
        render();
      } else {
        toast('Approve failed: ' + ((r.body && r.body.error) || ('HTTP ' + r.status)));
        state.approving = false;
        render();
      }
    }).catch(function () {
      toast('Approve failed: network');
      state.approving = false;
      render();
    });
  }

  function onSend() {
    var ta = document.getElementById('comment');
    var btn = document.getElementById('btn-send');
    var it = state.items[state.idx];
    if (!it) return;
    var text = ta.value.trim();
    if (!text) { toast('Write a comment first'); return; }
    btn.disabled = true;
    btn.textContent = 'Sending…';
    api('/review/api/comment', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key: it.key, target: state.target, text: text }),
    }).then(function (r) {
      if (r.body && r.body.ok) {
        toast('Sent → ' + (state.target === 'left' ? 'What\u2019s left' : 'Original request'));
        if (state.target === 'left') it.whatsLeft = (it.whatsLeft ? it.whatsLeft + '\n' : '') + r.body.stamped;
        else it.originalRequest = (it.originalRequest ? it.originalRequest + '\n' : '') + r.body.stamped;
        state.approving = false;
        render();
      } else {
        toast('Send failed: ' + ((r.body && r.body.error) || ('HTTP ' + r.status)));
        btn.disabled = false;
        btn.textContent = 'Send ➤';
      }
    }).catch(function () {
      toast('Send failed: network');
      btn.disabled = false;
      btn.textContent = 'Send ➤';
    });
  }

  function fetchState(isRefresh) {
    var q = isRefresh ? (query ? query + '&refresh=1' : '?refresh=1') : query;
    fetch('/review/api/state' + q, { headers: { Accept: 'application/json' } })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (data && data.ok) {
          var cur = state.items[state.idx] && state.items[state.idx].key;
          state.items = data.items || [];
          var at = state.items.findIndex(function (x) { return x.key === cur; });
          state.idx = at >= 0 ? at : 0;
          document.getElementById('live-indicator').style.background = '#10b981';
          render();
        }
      })
      .catch(function () {
        document.getElementById('live-indicator').style.background = '#ef4444';
      });
  }

  var btnRef = document.getElementById('btn-refresh');
  btnRef.addEventListener('click', function () {
    btnRef.classList.add('spinning');
    fetchState(true);
    setTimeout(function () { btnRef.classList.remove('spinning'); }, 600);
  });

  fetchState(false);
  setInterval(function () {
    if (document.visibilityState === 'visible') fetchState(false);
  }, 30000);
})();
</script>
</body>
</html>
