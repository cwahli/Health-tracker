<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Review Queue</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --gutter: clamp(10px, 3vw, 22px); }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; padding: 0;
    background: #0b1220; color: #e2e8f0;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-text-size-adjust: 100%; line-height: 1.5;
    display: flex; flex-direction: column; height: 100dvh; overflow: hidden;
  }

  /* --- masthead: title, refresh, pager -------------------------------- */
  .masthead {
    flex: 0 0 auto;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: #0b1220; padding: 6px var(--gutter); border-bottom: 1px solid #1e293b;
  }
  .title-group { display: flex; align-items: center; gap: 8px; }
  h1 { color: #f8fafc; font-size: clamp(15px, 3.5vw, 19px); margin: 0; }
  .live-dot { width: 7px; height: 7px; border-radius: 50%; background: #10b981; box-shadow: 0 0 6px #10b981; }
  .btn-refresh {
    background: #1e293b; border: 1px solid #334155; color: #93c5fd;
    border-radius: 6px; padding: 2px 7px; font-size: 13px; cursor: pointer;
    line-height: 1.2; display: inline-flex; align-items: center; justify-content: center;
    transition: background 0.15s, transform 0.15s; user-select: none;
  }
  .btn-refresh:hover { background: #334155; }
  .btn-refresh.spinning { animation: spin 0.8s linear infinite; pointer-events: none; opacity: 0.7; }
  @keyframes spin { 100% { transform: rotate(360deg); } }
  .pager { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #93c5fd; }
  .pager button {
    background: #1e293b; border: 1px solid #334155; color: #93c5fd;
    border-radius: 6px; padding: 3px 9px; font-size: 14px; cursor: pointer;
  }
  .pager button:disabled { opacity: 0.3; }

  /* --- one-word tabs --------------------------------------------------- */
  .tabs {
    flex: 0 0 auto; display: flex; background: #0b1220;
    border-bottom: 1px solid #1e293b;
  }
  .tabs button {
    flex: 1; cursor: pointer; padding: 8px 4px; font-size: 12.5px; font-weight: 600;
    color: #7f93b0; background: transparent; border: none;
    border-bottom: 2px solid transparent;
    transition: color 0.12s, border-color 0.12s;
  }
  .tabs button.on { color: #fff; border-bottom-color: #3b82f6; }

  /* --- panel: the image gets the space -------------------------------- */
  .panel { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
  .view { display: none; flex: 1 1 auto; min-height: 0; flex-direction: column; }
  .view.on { display: flex; }
  .view.scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain; }

  /* Info card: sits above the proof stage, capped so the shot keeps the space */
  .info { padding: 8px var(--gutter); flex: 0 0 auto; max-height: 30vh; overflow-y: auto;
          background: #0f172a; border-bottom: 1px solid #1e293b; }
  .kv { margin-bottom: 10px; }
  .kv:last-child { margin-bottom: 0; }
  .kv h3 {
    margin: 0 0 3px; font-size: 10.5px; text-transform: uppercase;
    letter-spacing: .06em; color: #64748b;
  }
  .kv p { margin: 0; font-size: 13.5px; color: #e2e8f0; white-space: pre-wrap; overflow-wrap: break-word; }
  .kv .key { color: #7dd3fc; font-family: "SF Mono", Consolas, monospace; font-size: 12.5px; }
  .kv .gate { color: #fbbf24; }

  /* Text tabs (request / to do) */
  .text { padding: 14px var(--gutter); font-size: 15px; color: #e2e8f0;
          white-space: pre-wrap; overflow-wrap: break-word; }

  /* Image stage: full-bleed, snap carousel, heart on the right edge */
  .stage { position: relative; flex: 1 1 auto; min-height: 0; background: #000; }
  .track {
    display: flex; height: 100%; overflow-x: auto; scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain; scrollbar-width: none;
  }
  .track::-webkit-scrollbar { display: none; }
  .track figure { margin: 0; flex: 0 0 100%; height: 100%; scroll-snap-align: center;
                  display: flex; align-items: center; justify-content: center; position: relative; }
  .track img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
  .noproof {
    flex: 1 1 auto; display: flex; align-items: center; justify-content: center;
    text-align: center; color: #64748b; font-size: 13px; padding: 24px;
  }
  .count {
    position: absolute; left: 10px; bottom: 10px; z-index: 3;
    background: rgba(0,0,0,.6); border: 1px solid #334155; color: #e2e8f0;
    border-radius: 9999px; padding: 2px 9px; font-size: 11px;
  }
  .heart {
    position: absolute; right: 10px; bottom: 10px; z-index: 4;
    width: 52px; height: 52px; border-radius: 50%; border: none; cursor: pointer;
    background: rgba(15,23,42,.72); color: #fca5a5; font-size: 25px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 10px rgba(0,0,0,.5);
    transition: transform 0.12s, background 0.12s, color 0.12s;
  }
  .heart:active { transform: scale(0.9); }
  .heart.confirm { background: #b45309; color: #fff; }

  /* --- composer: no send button, keyboard sends ----------------------- */
  .composer {
    flex: 0 0 auto; background: #0b1220; border-top: 1px solid #1e293b;
    padding: 6px var(--gutter) calc(6px + env(safe-area-inset-bottom));
  }
  .target { display: flex; gap: 6px; margin-bottom: 6px; }
  .target button {
    cursor: pointer; padding: 4px 12px; font-size: 11.5px; font-weight: 600;
    color: #7f93b0; background: #111c33; border: 1px solid #1e293b; border-radius: 9999px;
    transition: color 0.12s, background 0.12s, border-color 0.12s;
  }
  .target button.on { color: #fff; background: #1d4ed8; border-color: #3b82f6; }
  textarea {
    width: 100%; min-height: 40px; max-height: 22vh; resize: none;
    background: #111c33; border: 1px solid #1e293b; border-radius: 10px;
    color: #e2e8f0; font-size: 14px; padding: 9px 11px; font-family: inherit; line-height: 1.35;
  }
  .hint { font-size: 10.5px; color: #475569; margin-top: 4px; }

  .toast {
    position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%);
    background: #111c33; border: 1px solid #334155; color: #f8fafc;
    border-radius: 8px; padding: 8px 14px; font-size: 13px; z-index: 50;
    max-width: 88vw; text-align: center;
  }
  .empty { flex: 1 1 auto; display: flex; flex-direction: column; align-items: center;
           justify-content: center; text-align: center; color: #64748b; padding: 24px; }
  .empty .big { font-size: 38px; }
  .lightbox {
    position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.95);
    display: none; align-items: center; justify-content: center;
  }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 100vw; max-height: 100vh; object-fit: contain; }
</style>
</head>
<body>
<div class="masthead">
  <div class="title-group">
    <span class="live-dot" id="live-indicator" title="Connected"></span>
    <h1>Review</h1>
    <button id="btn-refresh" class="btn-refresh" title="Refresh queue" aria-label="Refresh queue">🔄</button>
  </div>
  <div class="pager">
    <button id="btn-prev" aria-label="Previous item">‹</button>
    <span id="pos">0/0</span>
    <button id="btn-next" aria-label="Next item">›</button>
  </div>
</div>

<div class="tabs" id="tabs">
  <button data-tab="info">Info</button>
  <button data-tab="request">Request</button>
  <button data-tab="todo">To&nbsp;do</button>
</div>

<div class="panel" id="panel"></div>

<div class="composer" id="composer" hidden>
  <div class="target" id="target">
    <button data-target="left">To&nbsp;do</button>
    <button data-target="original">Request</button>
  </div>
  <textarea id="comment" rows="1" placeholder="Comment for the agent…"></textarea>
  <div class="hint">Enter sends · Shift+Enter new line</div>
</div>

<div class="lightbox" id="lightbox"><img id="lightbox-img" alt="proof fullscreen"></div>

<script>
(function () {
  var tg = null;
  try {
    tg = window.Telegram && window.Telegram.WebApp;
    if (tg) {
      if (tg.ready) tg.ready();
      if (tg.expand) tg.expand();
      if (tg.disableVerticalSwipes) { try { tg.disableVerticalSwipes(); } catch (e) {} }
    }
  } catch (e) {}

  var state = { items: [], idx: 0, tab: 'info', target: 'left', busy: false };
  var query = location.search || '';
  var builtKey = null; // item key currently in the DOM — the blink guard

  function esc(s) {
    if (s === null || s === undefined || s === '') return '<span style="color:#475569">—</span>';
    return String(s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function toast(msg) {
    var old = document.querySelector('.toast');
    if (old) old.remove();
    var t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 3000);
  }

  function proofUrl(key, fileId) {
    var q = query ? query + '&' : '?';
    return '/review/api/proof' + q + 'key=' + encodeURIComponent(key) + '&file=' + encodeURIComponent(fileId);
  }

  function api(path, opts) {
    return fetch(path + query, opts).then(function (res) {
      return res.json().then(function (j) { return { status: res.status, body: j }; });
    });
  }

  /* --- build the item's DOM ONCE; later toggles only flip classes ---- */
  function build(it) {
    builtKey = it.key;
    var panel = document.getElementById('panel');
    var composer = document.getElementById('composer');
    var proofs = it.proofs || [];

    var views = '';
    views += '<div class="view scroll info" data-view="info">'
      + '<div class="kv"><h3>Ticket</h3><p class="key">' + esc(it.key) + (it.ref ? ' · ' + esc(it.ref) : '') + '</p></div>'
      + '<div class="kv"><h3>Owner</h3><p>' + esc(it.owner) + '</p></div>'
      + '<div class="kv"><h3>Last activity</h3><p>' + esc(it.lastActivity) + '</p></div>'
      + (it.gate ? '<div class="kv"><h3>Gate</h3><p class="gate">' + esc(it.gate) + '</p></div>' : '')
      + '<div class="kv"><h3>Work done</h3><p>' + esc(it.workDone) + '</p></div>'
      + '<div class="kv"><h3>Proof</h3><p>' + (proofs.length ? proofs.map(function (p) { return esc(p.name); }).join('\n') : 'none filed') + '</p></div>'
      + '</div>';
    views += '<div class="view scroll text" data-view="request"><div id="pane-request">' + esc(it.originalRequest) + '</div></div>';
    views += '<div class="view scroll text" data-view="todo"><div id="pane-todo">' + esc(it.whatsLeft) + '</div></div>';

    var stage = '';
    if (proofs.length) {
      stage = '<div class="stage"><div class="track" id="track">'
        + proofs.map(function (p, i) {
            var src = proofUrl(it.key, p.id);
            return '<figure><img src="' + src + '" alt="proof ' + (i + 1) + ' of ' + proofs.length + '" data-full="' + src + '"></figure>';
          }).join('')
        + '</div>'
        + '<div class="count" id="imgcount">' + (proofs.length > 1 ? '1/' + proofs.length : '1 shot') + '</div>'
        + '<button class="heart" id="heart" title="Done — archive" aria-label="Mark done and archive">🤍</button>'
        + '</div>';
    } else {
      stage = '<div class="noproof">No proof screenshots filed.<br>Heart it only if the proof is acceptable elsewhere.</div>'
        + '<div style="position:relative;flex:0 0 auto">'
        + '<button class="heart" id="heart" style="position:static;margin:-64px auto 0;display:flex" title="Done — archive" aria-label="Mark done and archive">🤍</button>'
        + '</div>';
    }

    // Info first, then the proof stage: the meta card sits ABOVE the image.
    panel.innerHTML = views + '<div class="view on" data-view="proof">' + stage + '</div>';

    if (proofs.length) {
      var track = document.getElementById('track');
      var count = document.getElementById('imgcount');
      track.addEventListener('scroll', function () {
        var i = Math.round(track.scrollLeft / Math.max(1, track.clientWidth));
        count.textContent = (i + 1) + '/' + proofs.length;
      }, { passive: true });
      panel.querySelectorAll('.track img').forEach(function (img) {
        img.addEventListener('click', function () {
          document.getElementById('lightbox-img').src = img.getAttribute('data-full');
          document.getElementById('lightbox').classList.add('open');
        });
      });
    }
    document.getElementById('heart').addEventListener('click', onHeart);
    composer.hidden = false;
  }

  /* --- view switching: class flips only, nothing rebuilt --------------
     The blink was a full innerHTML rebuild per tap (the <img> reloaded and
     flashed). Views are built once per item; a tap only toggles `on`, and the
     image keeps its DOM node, its loaded bytes and its scroll position. */
  function showProofView() {
    var proof = document.querySelector('[data-view="proof"]');
    var stage = document.querySelector('.stage');
    if (stage) stage.hidden = false;
    document.querySelectorAll('#panel .view').forEach(function (v) { if (v !== proof) v.classList.remove('on'); });
    if (proof) proof.classList.add('on');
    document.querySelectorAll('#tabs button').forEach(function (b) { b.classList.remove('on'); });
    state.tab = 'proof';
  }

  function showTextView(name) {
    state.tab = name;
    var proof = document.querySelector('[data-view="proof"]');
    var stage = document.querySelector('.stage');
    var infoView = document.querySelector('#panel .view[data-view="info"]');
    // Info is a sibling card above the stage; Request/To do are full views that
    // replace it. A tab tap only flips classes — no innerHTML, no reloaded <img>.
    if (infoView) infoView.classList.toggle('on', name === 'info');
    var isText = name === 'request' || name === 'todo';
    if (stage) stage.hidden = isText;
    if (proof) proof.classList.toggle('on', !isText);
    var view = document.querySelector('#panel .view[data-view="' + name + '"]');
    if (view && isText) view.classList.add('on');
    document.querySelectorAll('#panel .view[data-view="request"], #panel .view[data-view="todo"]').forEach(function (v) {
      if (v.getAttribute('data-view') !== name) v.classList.remove('on');
    });
    document.querySelectorAll('#tabs button').forEach(function (b) {
      b.classList.toggle('on', b.getAttribute('data-tab') === name);
    });
  }

  /* --- composer ------------------------------------------------------- */
  function setTarget(which) {
    state.target = which;
    document.querySelectorAll('#target button').forEach(function (b) {
      b.classList.toggle('on', b.getAttribute('data-target') === which);
    });
  }

  document.getElementById('tabs').addEventListener('click', function (e) {
    var tab = e.target.getAttribute('data-tab');
    if (!tab) return;
    showTextView(tab);
  });
  document.getElementById('target').addEventListener('click', function (e) {
    var t = e.target.getAttribute('data-target');
    if (!t) return;
    setTarget(t);
    var box = document.getElementById('comment');
    if (box && !state.busy) box.focus();
  });
  document.getElementById('comment').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendComment(); }
  });

  function onHeart() {
    var btn = document.getElementById('heart');
    var it = state.items[state.idx];
    if (!it || !btn || state.busy) return;
    state.busy = true;
    btn.textContent = '…';
    api('/review/api/approve', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key: it.key }),
    }).then(function (r) {
      state.busy = false;
      if (r.body && r.body.ok) {
        toast('Archived ✅ ' + it.key);
        state.items.splice(state.idx, 1);
        if (state.idx >= state.items.length) state.idx = Math.max(0, state.items.length - 1);
        render();
      } else {
        btn.textContent = '🤍';
        toast('Approve failed: ' + ((r.body && r.body.error) || ('HTTP ' + r.status)));
      }
    }).catch(function () { state.busy = false; btn.textContent = '🤍'; toast('Approve failed: network'); });
  }

  function sendComment() {
    var ta = document.getElementById('comment');
    var it = state.items[state.idx];
    if (!it || state.busy) return;
    var text = ta.value.trim();
    if (!text) return;
    state.busy = true;
    api('/review/api/comment', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key: it.key, target: state.target, text: text }),
    }).then(function (r) {
      state.busy = false;
      if (r.body && r.body.ok) {
        var pane = document.getElementById(state.target === 'left' ? 'pane-todo' : 'pane-request');
        var before = pane ? pane.innerHTML : '';
        if (pane) pane.innerHTML = before + '\n' + esc(r.body.stamped);
        ta.value = '';
        toast('Sent → ' + (state.target === 'left' ? 'To do' : 'Request'));
      } else {
        toast('Send failed: ' + ((r.body && r.body.error) || ('HTTP ' + r.status)));
      }
    }).catch(function () { state.busy = false; toast('Send failed: network'); });
  }

  /* --- render: only rebuilds when the item actually changes ----------- */
  function render() {
    var panel = document.getElementById('panel');
    var prev = document.getElementById('btn-prev');
    var next = document.getElementById('btn-next');
    document.getElementById('pos').textContent = state.items.length ? ((state.idx + 1) + '/' + state.items.length) : '0/0';
    prev.disabled = state.idx <= 0;
    next.disabled = state.idx >= state.items.length - 1;
    if (!state.items.length) {
      builtKey = null;
      panel.innerHTML = '<div class="empty"><div class="big">🎉</div><p>No items awaiting review.<br>Agents set Status to <b>review</b> when work is ready for human eyes.</p></div>';
      document.getElementById('composer').hidden = true;
      return;
    }
    var it = state.items[state.idx];
    if (builtKey !== it.key) {
      build(it);
      showProofView();
    }
  }

  document.getElementById('btn-prev').addEventListener('click', function () {
    if (state.idx > 0) { state.idx -= 1; render(); }
  });
  document.getElementById('btn-next').addEventListener('click', function () {
    if (state.idx < state.items.length - 1) { state.idx += 1; render(); }
  });
  document.getElementById('lightbox').addEventListener('click', function () {
    this.classList.remove('open');
    document.getElementById('lightbox-img').src = '';
  });
  document.getElementById('btn-refresh').addEventListener('click', function () {
    this.classList.add('spinning');
    fetchState(true);
    setTimeout(function () { document.getElementById('btn-refresh').classList.remove('spinning'); }, 600);
  });

  function fetchState(isRefresh) {
    var q = isRefresh ? (query ? query + '&refresh=1' : '?refresh=1') : query;
    fetch('/review/api/state' + q, { headers: { Accept: 'application/json' } })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (data && data.ok) {
          var cur = state.items[state.idx] && state.items[state.idx].key;
          state.items = data.items || [];
          var at = -1;
          for (var i = 0; i < state.items.length; i++) { if (state.items[i].key === cur) { at = i; break; } }
          state.idx = at >= 0 ? at : Math.min(state.idx, Math.max(0, state.items.length - 1));
          document.getElementById('live-indicator').style.background = '#10b981';
          render();
        }
      })
      .catch(function () {
        document.getElementById('live-indicator').style.background = '#ef4444';
      });
  }

  setTarget('left');
  fetchState(false);
  setInterval(function () {
    if (document.visibilityState === 'visible') fetchState(false);
  }, 30000);
})();
</script>
</body>
</html>
